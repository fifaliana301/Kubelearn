apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-newdeployment
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx-container
          image: nginx:1.24.2
          ports:
            - containerPort: 80
